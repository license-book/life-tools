name: Manualize calculators

on:
  push:
    paths:
      - '.github/workflows/manualize-calculators.yml'
      - 'scripts/manualize-calculators.mjs'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Convert calculators to explicit run mode
        run: node scripts/manualize-calculators.mjs
      - name: Install dependencies
        run: npm install
      - name: Build verification
        run: npm run build
      - name: Commit verified migration
        run: |
          if git diff --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/tools
          git commit -m "Apply explicit calculate buttons across calculators"
          git push origin HEAD:main
