name: Fix loan direct render
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-loan-direct-render.mjs'
      - '.github/workflows/fix-loan-direct-render.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fix-loan-direct-render.mjs
      - run: npm install
      - run: npm run build
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/tools/LoanCalculator.tsx
          git commit -m "Render loan results directly from applied inputs"
          git push origin HEAD:main
